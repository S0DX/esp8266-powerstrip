[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
upload_speed = 115200
monitor_speed = 115200
upload_port = COM29
lib_deps =
    PubSubClient
    EspSoftwareSerial

[env:esp12e-ota]
platform = espressif8266
board = esp12e
framework = arduino
upload_protocol = espota
upload_flags = --auth=ota_password
upload_port = 192.168.199.140
lib_deps =
    PubSubClient
    EspSoftwareSerial
