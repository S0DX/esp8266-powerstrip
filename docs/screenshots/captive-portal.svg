<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="-apple-system,BlinkMacSystemFont,sans-serif">
  <rect width="480" height="360" fill="#e5e5ea"/>
  <!-- 手机边框 -->
  <rect x="160" y="20" width="160" height="320" rx="20" fill="#1c1c1e"/>
  <rect x="166" y="26" width="148" height="308" rx="16" fill="#fff"/>
  <!-- 状态栏 -->
  <text x="186" y="48" font-size="9" font-weight="600" fill="#1c1c1e">9:41</text>
  <text x="290" y="48" font-size="9" font-weight="600" fill="#1c1c1e">📶 📷 100%</text>
  <!-- 系统弹窗 -->
  <rect x="178" y="120" width="124" height="120" rx="14" fill="rgba(255,255,255,0.96)" stroke="rgba(0,0,0,0.1)"/>
  <text x="240" y="148" font-size="10" font-weight="600" fill="#1c1c1e" text-anchor="middle">登录网络</text>
  <text x="190" y="168" font-size="8" fill="#8e8e93">"PowerStrip" WiFi 网络</text>
  <text x="190" y="180" font-size="8" fill="#8e8e93">需要登录后方可使用</text>
  <line x1="178" y1="190" x2="302" y2="190" stroke="#e5e5ea" stroke-width="0.5"/>
  <text x="240" y="206" font-size="10" font-weight="500" fill="#007aff" text-anchor="middle">查看网络</text>
  <line x1="178" y1="214" x2="302" y2="214" stroke="#e5e5ea" stroke-width="0.5"/>
  <text x="240" y="230" font-size="10" font-weight="500" fill="#007aff" text-anchor="middle">取消</text>
  <!-- 底部小标签 -->
  <text x="240" y="280" font-size="9" fill="#8e8e93" text-anchor="middle">iOS 弹窗示例</text>
  <!-- Android 平台说明 -->
  <text x="60" y="200" font-size="13" font-weight="600" fill="#1c1c1e">iOS</text>
  <text x="60" y="220" font-size="10" fill="#8e8e93">弹窗 /hotspot-detect.html</text>
  <!-- 右侧说明 -->
  <text x="340" y="200" font-size="13" font-weight="600" fill="#1c1c1e">Android</text>
  <text x="340" y="220" font-size="10" fill="#8e8e93">通知栏 /generate_204</text>
  <!-- 底部说明 -->
  <rect x="20" y="300" width="440" height="40" rx="8" fill="#fff"/>
  <text x="240" y="324" font-size="11" fill="#8e8e93" text-anchor="middle">跨平台 Captive Portal · v5.0 全平台支持</text>
</svg>
