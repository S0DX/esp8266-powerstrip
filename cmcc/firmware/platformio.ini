[env:esp12s]
platform = espressif8266
board = esp12e
framework = arduino
upload_speed = 115200
monitor_speed = 115200

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m1m.ld

upload_resetmethod = nodemcu
upload_port = COM*

lib_deps =
    ESP8266SoftwareSDK
    ESP8266HTTPUpdateServer

build_flags =
    -DVERSION=\"1.0.0\"
    -DDEBUG_MODE=1

[env:esp12s_ota]
platform = espressif8266
board = esp12e
framework = arduino
upload_protocol = espota
upload_port = PowerStrip.local
upload_flags =
    --auth=ota_password
    --port=8266
monitor_speed = 115200

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m1m.ld

lib_deps =
    ESP8266SoftwareSDK
    ESP8266HTTPUpdateServer

build_flags =
    -DVERSION=\"1.0.0\"
    -DDEBUG_MODE=1
